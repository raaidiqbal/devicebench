name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devicebench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python controller
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --cov=devicebench --cov-report=term-missing
      - name: Verify matrix expansion
        run: python -m devicebench plan --config configs/lab.json --output reports/plan.json

  apple-simulator:
    name: Swift and XCUITest
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install controller and XcodeGen
        run: |
          python -m pip install -e ".[dev]"
          brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec spec.yml
      - name: Record toolchain and simulator inventory
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Build test products once
        run: >-
          xcodebuild build-for-testing
          -project DeviceBench.xcodeproj
          -scheme DeviceBench
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO
      - name: Run diagnostic lab matrix
        run: >-
          python -m devicebench run
          --config configs/lab.ci.json
          --results reports
          --attempt-timeout 600
          --test-without-building
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devicebench-test-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 14

