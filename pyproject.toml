[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devicebench-lab"
version = "0.1.0"
description = "Simulator-first diagnostic workflow automation and failure triage"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Raaid Iqbal"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
]

[project.scripts]
devicebench = "devicebench.cli:main"

[tool.setuptools.packages.find]
include = ["devicebench*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["devicebench"]

