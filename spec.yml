name: DeviceBench
options:
  bundleIdPrefix: com.raaidiqbal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  DiagnosticCore:
    type: framework
    platform: iOS
    sources:
      - Sources/DiagnosticCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.raaidiqbal.devicebench.core
  DiagnosticFixtureApp:
    type: application
    platform: iOS
    sources:
      - Sources/DiagnosticFixtureApp
    dependencies:
      - target: DiagnosticCore
    info:
      path: Sources/DiagnosticFixtureApp/Info.plist
      properties:
        CFBundleDisplayName: DeviceBench
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  DiagnosticCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/DiagnosticCoreTests
    dependencies:
      - target: DiagnosticCore
  DeviceBenchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests/DeviceBenchUITests
    dependencies:
      - target: DiagnosticFixtureApp
schemes:
  DeviceBench:
    build:
      targets:
        DiagnosticCore: [test]
        DiagnosticFixtureApp: all
        DiagnosticCoreTests: [test]
        DeviceBenchUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - DiagnosticCoreTests
        - DeviceBenchUITests

